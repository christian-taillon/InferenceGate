    dependencies: [p1.contracts]
    acceptance_criteria:
      - >-
        Gateway runs with zero guard models configured
        (deterministic-only); any subset of Prompt Guard 2 (22M/86M),
        Llama Guard 3 (1B/8B), Granite Guardian 4.1 8B, gpt-oss-safeguard
        (20B/120B) is registrable per tenant/route/profile.
      - >-
        Registration runs the 14-fixture capability battery from
        GUARD_MODELS.md; undemonstrated features are disabled per provider;
        results stored and re-run on version/runtime/template change.
      - >-
        Strict per-backend parsers with reject-on-malformed: Llama Guard
        safe/unsafe+S-codes; Granite single <score>yes|no</score> with
        declared criterion polarity, <think> handled separately; gpt-oss
        strict JSON allow/violation/review with rule_ids.
      - >-
        Normalized guard result DTO emitted for every invocation (matched,
        model_decision, gateway_action, stage, policy/rule ids, score-or-null,
        model, provider, latency_ms); scores never fabricated.
    tests:
      - "fixture battery: 14 cases per registered provider"
      - "malformed-output, timeout, refusal → failure-policy events"
    notes:
      - Granite Guardian and gpt-oss-safeguard backends are net-new (no
        legacy code); Prompt Guard / Llama Guard wrap existing shields.
      - LiteLLM model_list/router may serve as transport to guard endpoints
        (evaluate in p05.capability-matrix) — registry owns semantics.

