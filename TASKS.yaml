  - id: p11.multi-tenant
    title: Multi-tenant enterprise controls (virtual keys, tenant manifests, RBAC)
    phase: p11-multi-tenant
    status: pending
    owner_agent: coder-codex
    files: [inference_gate/]
    dependencies: [p8.dehydration]
    acceptance_criteria: [Cross-tenant negative tests pass]
    tests: []
    notes:
      - "DEFERRED emphasis per D-010: core pipeline first."
      - >-
        Authoritative hierarchy is InferenceGate-owned, not LiteLLM-owned -
        Tenant -> Applications -> Environments -> Identities/Service
        Accounts -> LiteLLM virtual keys; Tenant -> Policy Bundles ->
        Assessment Rules. Every request gets a trusted internal context
        (tenant, application, environment, subject, roles, policy_bundle,
        session, trace) resolved BEFORE any control executes; never trust
        tenant/policy/bypass info in the request body; missing tenant
        context fails closed.
      - >-
        Auth: OIDC for the control plane (validate issuer/signature/
        audience, map claims to tenant+roles); never self-implement SAML -
        an identity broker (Keycloak/Authentik/Okta) presents OIDC to us.
        LiteLLM custom-auth hooks have budget/model-access caveats - verify
        in p05. Identity classes: admins (OIDC), developers (OIDC or virtual
        keys), applications (service accounts/workload identity), CI/CD
        (short-lived credentials).
      - >-
        Central administration is API-first - versioned API + declarative
        YAML; UI later as a client of the same API (D-010).

