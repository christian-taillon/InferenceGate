name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --python overrides .python-version so the matrix version is used;
        # dev + deployment dependency groups install by default (tool.uv)
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run live-proxy integration tests
        run: uv run pytest tests/ -m integration -v

      - name: Build distributable package
        run: uv build

      - name: Lint with ruff (optional)
        run: uv run ruff check . || true
        continue-on-error: true
