[project]
name = "inference-gate"
version = "0.1.0"
description = "A production-ready Enterprise LLM Firewall Gateway using LiteLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm[proxy]>=1.82.0",
    "openai>=2.26.0",
    "requests>=2.32.5",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]
local-prompt-guard = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
