[project]
name = "inference-gate"
version = "0.1.0"
description = "LLM firewall shields and security controls for LiteLLM Proxy"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Library metadata declares the tested-compatible litellm range for
# bring-your-own-LiteLLM installs (D-014). This repo's reference deployment
# stays exactly pinned via [tool.uv].constraint-dependencies + uv.lock
# (D-002): hook-dispatch semantics are verified per litellm version — run
# `uv run pytest tests/ -m integration` before adopting a new one.
dependencies = [
    "litellm[proxy]>=1.82.0",
    # imported directly by inference_gate.shields (classify endpoint client)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
local-prompt-guard = [
    "transformers>=5.14.1",
    "torch>=2.0.0",
]

[dependency-groups]
# Installed by default for this repo (tool.uv.default-groups below); never
# part of the published wheel.
dev = ["pytest>=9.1.1", "ruff>=0.16.2", "requests>=2.34.2"]
deployment = [
    # serve.py / demo.py / management-UI backend
    "openai>=2.53.0,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.0.1",
    "prisma==0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference_gate"]

[tool.uv]
default-groups = ["dev", "deployment"]
# The reference deployment runs the exact litellm version whose hook
# dispatch was verified (DECISIONS.md D-002, D-004, D-014).
constraint-dependencies = ["litellm==1.92.0"]

[tool.pytest.ini_options]
# Integration tests boot a live proxy; run them explicitly with -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: live LiteLLM proxy end-to-end tests (opt-in: -m integration)",
]
